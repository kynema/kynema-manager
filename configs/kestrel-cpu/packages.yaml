packages:
  intel-oneapi-compilers:
    externals:
      - spec: intel-oneapi-compilers@2025.3.0
        prefix: /nopt/nlr/apps/kestrel-cpu/craygen/oneapi/compiler
        extra_attributes:
          compilers:
            c: /nopt/nlr/apps/kestrel-cpu/craygen/oneapi/compiler/compiler/2025.3/bin/icx
            cxx: /nopt/nlr/apps/kestrel-cpu/craygen/oneapi/compiler/compiler/2025.3/bin/icpx
            fortran: /nopt/nlr/apps/kestrel-cpu/craygen/oneapi/compiler/compiler/2025.3/bin/ifx
          extra_rpaths:
          - /opt/cray/libfabric/1.22.0/lib64
  gcc:
    externals:
      - spec: gcc@13.1.0
        prefix: /opt/rh/gcc-toolset-13/root
        extra_attributes:
          compilers:
            c: /opt/rh/gcc-toolset-13/root/bin/gcc
            cxx: /opt/rh/gcc-toolset-13/root/bin/g++
            fortran: /opt/rh/gcc-toolset-13/root/bin/gfortran
          extra_rpaths:
          - /opt/cray/libfabric/1.22.0
  cray-mpich:
    require: "@8.1.32"
    buildable: false
    externals:
      - spec: "cray-mpich@8.1.32%intel-oneapi-compilers@2025.3.0"
        prefix: /opt/cray/pe/mpich/8.1.32/ofi/intel/2022.1
      - spec: "cray-mpich@8.1.32%gcc@13.1.0"
        prefix: /opt/cray/pe/mpich/8.1.32/ofi/gnu/11.2
  slurm:
    buildable: false
    externals:
      - spec: slurm@25-05-6
        prefix: /nopt/slurm/latest 
  libfabric:
    buildable: false
    externals:
      - spec: libfabric@1.22.0
        prefix: /opt/cray/libfabric/1.22.0 
  xpmem:
    buildable: false
    externals:
      - spec: xpmem@master
        prefix: /nopt/nlr/xpmem
  boost:
    require: "@1.80.0"
  netcdf-c:
    require: "+shared build_system=autotools"
  libxml2:
    require: "build_system=autotools"
  mpi:
    require: "cray-mpich"
  blas:
    require: "netlib-lapack"
  lapack:
    require: "netlib-lapack"
  hdf5:
    require: "~fortran"
  kynema-sgf:
    require: "target=x86_64"
  c:
    prefer:
      - intel-oneapi-compilers@2025.3.0
  cxx:
    prefer:
      - intel-oneapi-compilers@2025.3.0
  fortran:
    prefer:
      - intel-oneapi-compilers@2025.3.0
  all:
    prefer:
      - "build_type=Release"
      - "target=sapphirerapids"
    conflict:
      - "%gcc"
